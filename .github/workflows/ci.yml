# 持续集成：在 dev / main 的推送与 PR 上执行格式检查、静态检查、测试、构建与敏感信息扫描。
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 格式检查与测试
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 检查代码格式
        shell: pwsh
        run: |
          $unformatted = gofmt -l cmd internal tools
          if ($unformatted) {
            Write-Output "以下文件未通过 gofmt："
            $unformatted | ForEach-Object { Write-Output "  $_" }
            exit 1
          }
          Write-Output "代码格式检查通过"

      - name: 静态检查
        run: go vet ./...

      - name: 单元测试
        run: go test -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 运行 golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  build:
    name: 构建校验
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建 ${{ matrix.goarch }}
        shell: pwsh
        env:
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags "-H=windowsgui" -o codecounter-${{ matrix.goarch }}.exe ./cmd/codecounter

  secret-scan:
    name: 敏感信息扫描
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 使用 gitleaks 扫描
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
