# 依赖更新：每周检查 Go 模块与 GitHub Actions。
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    labels:
      - dependencies

  - package-ecosystem: gomod
    directory: /tools/genicons
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
